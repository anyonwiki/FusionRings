# ci/architecture_policy.toml
#
# First-pass FusionRings.jl architecture policy for FuncDeps.
#
# Names are matched case-insensitively, so "Structs", "structs", and
# "structs.jl" are treated in the natural way by the checker.
#
# 
#   Structs should not depend on any other project module/file.
#
# This allows functions in structs.jl to call other functions in structs.jl,
# but forbids calls from structs.jl into general_functions.jl, properties.jl,
# operations.jl, creation.jl, import_data.jl, etc.

case_insensitive = true

# Enforce "Structs does not depend on anything else."
independent_modules = ["structs"]
independent_files = ["structs.jl"]

# Reasonable first-pass forbidden dependencies based on a layered package shape:
#
#   structs / core definitions
#       ↓
#   general_functions / formatting helpers
#       ↓
#   operations / properties
#       ↓
#   creation / import_data / higher-level workflows
#
# These are intentionally conservative. You can relax or tighten them as the
# actual architecture settles.

[forbidden_module_deps]
structs = [
  "general_functions",
  "formatting_and_printing",
  "creation",
  "properties",
  "operations",
  "import_data",
  "categorifiability_criteria",
  "FusionRings",
]

general_functions = [
  "creation",
  "properties",
  "operations",
  "import_data",
  "categorifiability_criteria",
]

formatting_and_printing = [
  "creation",
  "properties",
  "operations",
  "import_data",
  "categorifiability_criteria",
]

operations = [
  "creation",
  "import_data",
]

properties = [
  "creation",
  "import_data",
]

creation = [
  "import_data",
]

categorifiability_criteria = [
  "creation",
  "import_data",
]

# If a function is listed under cross_module, it may call helpers in its own
# module/file but may not call project functions from other modules/files.
[independent_functions]
cross_module = [
  "structs.fusion_ring",
]

# If a function is listed under no_internal_calls, it should not call any other
# discovered project function at all. Base/stdlib/external calls are not counted
# because FuncDeps only records discovered project calls.
no_internal_calls = []

# Exact forbidden function edges can be added here later.
#
# Example:
# [forbidden_function_deps]
# "properties.is_commutative" = ["creation.su2_fusion_ring"]
