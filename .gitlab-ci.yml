stages:
  - test
  - architecture

.script:
  stage: test
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'

.coverage:
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'

Julia 1.12:
  image: julia:1.12
  extends:
    - .script
    - .coverage

weekly_level1_tests:
  stage: test
  image: julia:1.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - julia --project=@. -e 'using Pkg; Pkg.instantiate()'
    - FUSIONRINGS_TEST_LEVEL=level1 julia --project=@. test/runtests.jl

weekly_level2_tests:
  stage: test
  image: julia:1.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - julia --project=@. -e 'using Pkg; Pkg.instantiate()'
    - FUSIONRINGS_TEST_LEVEL=level2 julia --project=@. test/runtests.jl

weekly_level3_tests:
  stage: test
  image: julia:1.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - julia --project=@. -e 'using Pkg; Pkg.instantiate()'
    - FUSIONRINGS_TEST_LEVEL=level3 julia --project=@. test/runtests.jl

weekly_funcdeps_architecture:
  stage: architecture
  image: julia:1.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update
    - apt-get install -y graphviz
  script:
    - julia --project=@. -e 'using Pkg; Pkg.instantiate(); Pkg.add(url="https://github.com/Szagha02/FuncDeps.jl")'
    - julia --project=@. ci/run_funcdeps.jl
    - julia --project=@. ci/check_architecture.jl
  artifacts:
    when: always
    paths:
      - funcdeps_artifacts/
    expire_in: 4 weeks